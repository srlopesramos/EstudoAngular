<h1>Tarefas</h1>

<table class="table table-striped table-bordered table-hover">
  <thead>
  <tr>
    <th>Tarefa</th>
    <th>Concluída</th>
    <th class="text-center">
      <a
        [routerLink]="['/tarefas/cadastrar']"
        class="btn btn-xs btn-success">
           <span class="glyphicon glyphicon-plus"
                 aria-hidden="true"></span> Novo
      </a>
    </th>
  </tr>
  </thead>
  <tbody>
    @for (tarefa of tarefas; track tarefa.id) {
      <tr>
        <td
          [tarefaConcluida]="tarefa.concluida"
          [class.success]="!tarefa.concluida">
          {{ tarefa.nome }}
        </td>
        <td style="width: 70px" class="text-center">
          <input
            type="checkbox"
            [value]="tarefa.id"
            [checked]="tarefa.concluida"
            (click)="alertarStatus(tarefa)"
          >
        </td>
        <td class="text-center" style="width: 200px">
          <a
            title="Editar" alt="Editar"
            class="btn btn-xs btn-info me-sm"
            [routerLink]="['/tarefas/editar', tarefa.id]"
          >
        <span class="glyphicon glyphicon-pencil"
              aria-hidden="true"></span> Editar
          </a>
          <a
            (click)="remover($event, tarefa)"
            href="#"
            title="Remover"
            alt="Remover"

             class="btn btn-xs btn-danger">
        <span class="glyphicon glyphicon-remove"
              aria-hidden="true"></span> Remover
          </a>
        </td>
      </tr>
    }
  </tbody>
</table>
@if (tarefas.length < 1) {
  <p>Nenhuma tarefa cadastrada.</p>
}
